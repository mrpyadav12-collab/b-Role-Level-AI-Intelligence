[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce-ai-backend"
version = "0.1.0"
description = "Role-Level AI Intelligence - FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.128.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = [
    "ai",
    "analysis",
    "db",
    "main",
    "repository",
    "scoring",
    "seed_data",
]
